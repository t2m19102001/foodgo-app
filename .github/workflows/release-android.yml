# Build ban phat hanh da ky khi day tag dang v1.2.3:
#   git tag v1.0.0 && git push origin v1.0.0
#
# Secrets can tao trong Settings -> Secrets and variables -> Actions:
#   FOODGO_API_BASE_URL        https://api.ten-mien-cua-ban/   (co dau / cuoi)
#   ANDROID_KEYSTORE_BASE64    base64 cua file .jks  (base64 -w0 release.jks)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#   GOOGLE_SERVICES_JSON       (tuy chon) noi dung app/google-services.json de bat Crashlytics
#
# Ket qua: file .aab (nop Google Play) va .apk (cai thu / phan phoi noi bo) o
# muc Artifacts cua lan chay. Upload len Play Console lam tay o Internal testing
# truoc, roi moi day len Production theo staged rollout.
name: Release Android

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName, vd 1.0.0"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Xac dinh phien ban
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then NAME="${GITHUB_REF_NAME#v}"; else NAME="${{ inputs.version_name }}"; fi
          # versionCode phai tang dan qua moi ban: dung so lan chay cua workflow nay
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "code=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Giai ma keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Thieu secret ANDROID_KEYSTORE_BASE64"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Cau hinh Firebase (neu co)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Crashlytics: bat"
          else
            echo "Crashlytics: tat (khong co secret GOOGLE_SERVICES_JSON)"
          fi

      - name: Test truoc khi build
        run: ./gradlew :app:testDebugUnitTest

      - name: Build AAB + APK da ky
        env:
          FOODGO_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          FOODGO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FOODGO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FOODGO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew :app:bundleRelease :app:assembleRelease --stacktrace
          -PFOODGO_API_BASE_URL='${{ secrets.FOODGO_API_BASE_URL }}'
          -PFOODGO_VERSION_NAME='${{ steps.version.outputs.name }}'
          -PFOODGO_VERSION_CODE='${{ steps.version.outputs.code }}'
          -PFOODGO_REQUIRE_SIGNING=true

      - uses: actions/upload-artifact@v4
        with:
          name: foodgo-${{ steps.version.outputs.name }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt

      - name: Xoa keystore tam
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" app/google-services.json
